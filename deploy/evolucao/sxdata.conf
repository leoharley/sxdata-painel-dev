# SXData - ambiente de evolucao (sxdata.online)
# Painel + API: painel.sxdata.online   |   App web (PWA): app.sxdata.online

# Dominio raiz e www levam ao painel
server {
    listen 80;
    listen [::]:80;
    server_name sxdata.online www.sxdata.online;
    return 301 https://painel.sxdata.online$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name painel.sxdata.online;

    root /var/www/sxdata-painel;
    index index.php;

    # Fotos e audios enviados pelos aplicadores
    client_max_body_size 100M;

    access_log /var/log/nginx/painel.access.log;
    error_log  /var/log/nginx/painel.error.log;

    # Nada de codigo, configs, dumps ou metadados acessiveis pela web
    location ~ /\.                         { deny all; return 404; }
    location ~ ^/(application|system|vendor|sql|docs|tests|deploy)(/|$) { deny all; return 404; }
    location ~* \.(sql|md|rst|yml|lock|ppk|pem)$ { deny all; return 404; }
    location = /composer.json              { deny all; return 404; }

    # Arquivos enviados: nunca executar PHP aqui. CORS liberado porque o app
    # web (outro subdominio) carrega essas imagens/audios via fetch.
    location ^~ /uploads/ {
        add_header Access-Control-Allow-Origin "*" always;
        location ~ \.php$ { deny all; return 404; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php-fpm/sxdata.sock;
        fastcgi_param CI_ENV production;
        fastcgi_read_timeout 300;
    }

    # Qualquer outro .php direto e bloqueado (o CodeIgniter so usa index.php)
    location ~ \.php$ { deny all; return 404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.sxdata.online;

    root /var/www/sxdata-app;
    index index.html;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    # Estes arquivos decidem qual versao o aparelho carrega: sem cache, senao
    # um deploy novo demora a chegar (ver aviso "Nova versao" no index.html).
    location = /index.html                { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /version.json              { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.json             { add_header Cache-Control "no-cache"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
