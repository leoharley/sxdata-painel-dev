# Cabecalhos de seguranca do SXData. O nginx 1.26 nao herda add_header de
# fora para dentro de uma location que tenha os seus: entao toda location
# com add_header inclui este arquivo de novo.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
